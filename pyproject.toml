[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githost-mcp"
version = "0.9.0"
description = "Unified local + multi-provider git MCP server with per-agent audit trail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "gitpython>=3.1",
    "pygithub>=2.0",
    "python-gitlab>=4.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pyyaml>=6.0",
    # Floors on fastmcp's transitive deps, now load-bearing since Phase 1 activates the
    # HTTP transport stack for the first time. Fix known CVEs: starlette PYSEC-2026-248/249,
    # mcp CVE-2026-59950, cryptography GHSA-537c-gmf6-5ccf (githost-mcp-http-pm2-migration-2026-07).
    "starlette>=1.3.1",
    "mcp>=1.28.1",
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
loki = [
    "httpx>=0.27",
]
prometheus = [
    "prometheus-client>=0.20",
]
nats = [
    "nats-py>=2.7",
]
observability = [
    "githost-mcp[otel,loki,prometheus,nats]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "twine>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
githost-mcp = "githost_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["githost_mcp"]

[tool.coverage.report]
# Repo-standards Baseline 80% floor, reached in build
# githost-mcp-baseline-and-ci-2026-07 (Phase 3). Measured coverage sits above this.
fail_under = 80
show_missing = true
