[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githost-mcp"
version = "0.17.0"
description = "Unified local + multi-provider git MCP server with per-agent audit trail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Capped below 4: 4.x is a major this server has never run on. uv.lock pins what is
    # tested and deployed; the CI `latest` job resolves the newest versions these ranges
    # allow, so a forward-compat break shows up there rather than at the next deploy.
    # fastmcp 3.4.10 is a security floor: it fixes GHSA-7xgj-8392-5q4r.
    "fastmcp>=3.4.10,<4",
    # 3.2.1 is the only release clearing every open GitPython advisory (#912):
    # CVE-2026-114145 (create_submodule, unused here) has no 3.1.x fix.
    "gitpython>=3.2.1",
    # 2.6.0 added PullRequest.mark_ready_for_review(), which github_pr_update needs.
    "pygithub>=2.6.0",
    "python-gitlab>=4.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pyyaml>=6.0",
    # Security floors on transitive deps. None is imported here directly; each is declared
    # only to hold its floor. uv.lock is the control: it pins every package, and a deploy
    # builds a fresh venv from it. These floors are the second line, for an install that
    # re-resolves into an existing venv (`pip install .`) and would otherwise keep an old
    # version it finds there.
    #
    # Scope, checked 2026-10-26 against every published advisory for every package in the
    # locked runtime set: each package on the HTTP transport this server serves (including
    # fastmcp's auth stack, which checks the bearer token) and on the GitHub/Gitea client
    # path that carries the credentials has a floor at or above its newest fix. Packages
    # off those paths whose ranges still admit an advisory are held only by the lock:
    # certifi, dnspython, jaraco-context, protobuf, pydantic-settings, pygments, pynacl,
    # python-dotenv.
    #
    # starlette 1.3.1: PYSEC-2026-248/249.
    "starlette>=1.3.1",
    # mcp 1.30.0: CVE-2026-59951 (StreamableHTTP, the transport this server runs) and
    # PYSEC-2026-3481/3482/3483. Capped below 2 with fastmcp's own range.
    "mcp>=1.30,<2",
    # cryptography 50.0.0: PYSEC-2026-3552.
    "cryptography>=50.0.0",
    # python-multipart 0.0.31: PYSEC-2026-3036/3037/3040.
    "python-multipart>=0.0.31",
    # pyjwt 2.15.0: PYSEC-2026-4140..4152, PYSEC-2026-4183, GHSA-pxh4-856f-4h89.
    # Reached through both mcp and PyGithub.
    "pyjwt>=2.15.0",
    # urllib3 2.8.0: PYSEC-2026-4175/4176/4177. PyGithub's HTTP client (via requests).
    "urllib3>=2.8.0",
    # anyio 4.14.2: PYSEC-2026-4024/4025.
    "anyio>=4.14.2",
    # h11 0.16.0: GHSA-vqfr-h8mv-ghfj. uvicorn's HTTP/1.1 parser.
    "h11>=0.16.0",
    # requests 2.33.0: GHSA-gc5v-m9x4-r6x2 and earlier. PyGithub's and python-gitlab's client.
    "requests>=2.33.0",
    # idna 3.15: GHSA-65pc-fj4g-8rjx. Host encoding for httpx and requests.
    "idna>=3.15",
    # authlib 1.7.1 (GHSA-r95x-qfjj-fjj2) and joserfc 1.6.8 (GHSA-gg9x-qcx2-xmrh):
    # fastmcp's auth stack.
    "authlib>=1.7.1",
    "joserfc>=1.6.8",
]

[project.optional-dependencies]
otel = [
    # opentelemetry-api 1.45.1: CVE-2026-114603. Transitive through the SDK.
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
loki = [
    "httpx>=0.27",
]
prometheus = [
    "prometheus-client>=0.20",
]
nats = [
    "nats-py>=2.7",
]
observability = [
    "githost-mcp[otel,loki,prometheus,nats]",
]
dev = [
    # prometheus-client is an *optional* runtime extra but a *required* test dep:
    # the denial-counter tests assert on real Counter label behaviour, and a stubbed
    # module cannot show that reason_class is bounded. Without it here those tests
    # would skip in CI while still reporting green.
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "twine>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
githost-mcp = "githost_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["githost_mcp"]

[tool.coverage.report]
# Repo-standards Baseline 80% floor, reached in build
# githost-mcp-baseline-and-ci-2026-07 (Phase 3). Measured coverage sits above this.
fail_under = 80
show_missing = true
